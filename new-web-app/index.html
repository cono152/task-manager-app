<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理アプリ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="top-nav" role="navigation" aria-label="メインナビゲーション">
        <div class="nav-inner">
            <a href="#" class="brand"><i class="fas fa-check-double"></i> タスク管理</a>
            <div class="nav-actions">
                <button id="scrollToAdd" class="btn btn-ghost" aria-label="タスク追加欄へ移動">
                    <i class="fas fa-plus"></i> タスクを追加
                </button>
                <a href="#taskList" class="btn btn-ghost" aria-label="タスクリストへ移動">
                    <i class="fas fa-list"></i> タスク一覧
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="header hero">
            <h1><i class="fas fa-tasks"></i> タスク管理アプリ</h1>
            <p>効率的にタスクを管理しましょう。素早く追加し、賢く分類し、きれいに完了。</p>
            <div class="hero-actions">
                <button id="heroAddBtn" class="btn btn-primary" aria-label="タスクの追加を開始">
                    <i class="fas fa-plus"></i> 今すぐ追加
                </button>
                <a href="#taskList" class="btn btn-ghost">
                    <i class="fas fa-arrow-down"></i> タスク一覧へ
                </a>
            </div>
        </header>

        <main class="main-content">
            <div class="layout">
                <aside class="sidebar" aria-label="フィルターと統計">
                    <div class="filter-section">
                        <div class="filter-buttons">
                            <button class="filter-btn active" data-filter="all">すべて</button>
                            <button class="filter-btn" data-filter="pending">未完了</button>
                            <button class="filter-btn" data-filter="completed">完了済み</button>
                        </div>
                        <div class="task-stats">
                            <span id="taskCount" aria-live="polite">0件のタスク</span>
                        </div>
                    </div>

                    <div class="tips-card" role="note" aria-label="使い方のヒント">
                        <h2 class="tips-title"><i class="fas fa-lightbulb"></i> ヒント</h2>
                        <ul class="tips-list">
                            <li><strong>Enter</strong> で素早く追加</li>
                            <li><strong>クリック</strong>で完了/未完了を切替</li>
                            <li><strong>編集</strong>で名前を変更</li>
                            <li><strong>削除</strong>でタスクを整理</li>
                        </ul>
                    </div>
                </aside>

                <section class="content" aria-label="タスク">
                    <div class="task-input-section">
                        <div class="input-group">
                            <label for="taskInput" class="sr-only">タスクを入力</label>
                            <input type="text" id="taskInput" placeholder="新しいタスクを入力してください..." maxlength="100">
                            <button id="addTaskBtn" class="btn btn-primary" aria-label="タスクを追加">
                                <i class="fas fa-plus"></i> 追加
                            </button>
                        </div>
                    </div>

                    <div class="task-list-section">
                        <ul id="taskList" class="task-list" role="list">
                            <!-- タスクがここに動的に追加されます -->
                        </ul>
                        <div id="emptyState" class="empty-state" role="region" aria-live="polite">
                            <i class="fas fa-clipboard-list"></i>
                            <p>まだタスクがありません</p>
                            <p>上の入力欄から新しいタスクを追加してください</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 タスク管理アプリ. すべての権利を保有.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
